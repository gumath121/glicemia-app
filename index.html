  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, sans-serif;
      background: #fff8fb;

    }

      max-width: 600px;
      margin: auto;

    }


    /* =====================================================
       TELA DE LEMBRETE
       ===================================================== */

    .lembrete-tela {
      position: fixed;

      z-index: 9999;

    .lembrete-tela.oculta {

    .lembrete-card {

      max-width: 430px;

      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(120, 80, 100, 0.12);
    }


    .lembrete-coracao {
      font-size: 48px;
      color: #b97892;

    }


    .lembrete-card h2 {

    .lembrete-card p {

      width: 100%;

    /* =====================================================

       ===================================================== */

    header {

    }


    .heart {
      font-size: 38px;
      margin-bottom: 8px;
    }


    h1 {
      font-size: 26px;

      margin-bottom: 6px;
    }


    .subtitle {
      font-size: 14px;

    }


    .progress-box {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(120, 80, 100, 0.08);
      margin-bottom: 20px;
    }


    .progress-title {
      font-size: 14px;

    }


    .progress-number {
      font-size: 30px;

      color: #9b6178;
    }


    .progress-bar {
      width: 100%;
      height: 10px;
      background: #f1e5ea;
      border-radius: 20px;
      overflow: hidden;

    }


    .progress-fill {
      height: 100%;
      width: 0%;
      background: #c98fa7;
      border-radius: 20px;
      transition: 0.3s;
    }


    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(120, 80, 100, 0.08);
    }


    .day-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }


    .day-title h2 {
      color: #8f596f;
      font-size: 20px;
    }


    .date {
      font-size: 13px;
      color: #9b8991;
    }


    .field {
      margin-bottom: 16px;
    }


    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #6f5c65;
    }


    .input-row {
      display: flex;
      gap: 8px;
    }


    input,
    textarea {
      width: 100%;
      border: 1px solid #ead9df;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;

    input:focus,

    }

    }

    }


    textarea {

    }


    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .save-button {
      background: #b97892;
      color: white;
      margin-top: 5px;
    }


    .save-button:active {
      transform: scale(0.98);
    }


    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      min-height: 20px;
    }


    .history-title {
      font-size: 21px;
      color: #8f596f;
      margin: 28px 0 14px;
    }


    .history-item {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(120, 80, 100, 0.06);
    }


    .history-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }


    .history-day {
      font-weight: bold;
      color: #8f596f;
    }


    .history-date {
      color: #9b8991;
      font-size: 13px;
    }


    .values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }


    .value-box {
      background: #fff7fa;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
    }


    .value-box strong {
      display: block;
      font-size: 16px;
      color: #7d5967;
      margin-top: 3px;
    }


    .empty {
      text-align: center;
      color: #9b8991;

      padding: 20px;
    }


    @media (max-width: 400px) {

      .time-input {
        width: 100px;
      }

      h1 {
        font-size: 23px;
      }

      .lembrete-card {
        padding: 28px 20px;
      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     TELA INICIAL DO LEMBRETE
     ===================================================== -->

<div
  id="telaLembrete"
  class="lembrete-tela"
>

  <div class="lembrete-card">

    <div class="lembrete-coracao">
      ♡
    </div>


    <h2>
      Quando você quer ser lembrada?
    </h2>


    <p>
      Escolha um horário para receber seu
      lembrete diário para registrar a glicemia.
    </p>


    <input
      type="time"
      id="horarioLembrete"
      class="lembrete-horario"

    >


    <button

      onclick="ativarLembrete()"

    <div
      id="statusLembrete"
      class="lembrete-status"
    ></div>

</div>



<div class="app">


  <header>

    <div class="heart">
      ♡
    </div>


    <h1>
      Meu acompanhamento
    </h1>


    <p class="subtitle">
      Registro diário da glicemia
    </p>


    <button
      id="botaoAlterarLembrete"
      class="alterar-lembrete"
      onclick="mostrarConfiguracaoLembrete()"
    >
      🔔 Alterar horário do lembrete
    </button>

  </header>



  <div class="progress-box">

    <div class="progress-title">
      Progresso do acompanhamento
    </div>


    <div class="progress-number">

      <span id="diasPreenchidos">
        0
      </span>/10 dias

    </div>


    <div class="progress-bar">

      <div
        class="progress-fill"
        id="progressFill">
      </div>

    </div>

  </div>



  <div class="card">


    <div class="day-title">

      <h2 id="diaTitulo">
        Dia 1
      </h2>


      <span
        class="date"
        id="dataAtual">
      </span>

    </div>



    <div class="field">

      <label>
        🌙 Jejum / ao acordar
      </label>


      <div class="input-row">

        <input
          id="jejum"
          class="value-input"
          type="number"
          placeholder="Glicemia"
          inputmode="decimal"
        >


        <input
          id="horarioJejum"
          class="time-input"
          type="time"
        >

      </div>

    </div>



    <div class="field">

      <label>
        ☕ Antes do café da manhã
      </label>


      <div class="input-row">

        <input
          id="cafe"
          class="value-input"
          type="number"
          placeholder="Glicemia"
          inputmode="decimal"
        >


        <input
          id="horarioCafe"
          class="time-input"
          type="time"
        >

      </div>

    </div>



    <div class="field">

      <label>
        🍽️ Antes do almoço
      </label>


      <div class="input-row">

        <input
          id="almoco"
          class="value-input"
          type="number"
          placeholder="Glicemia"
          inputmode="decimal"
        >


        <input
          id="horarioAlmoco"
          class="time-input"
          type="time"
        >

      </div>

    </div>



    <div class="field">

      <label>
        🌙 Antes do jantar
      </label>


      <div class="input-row">

        <input
          id="jantar"
          class="value-input"
          type="number"
          placeholder="Glicemia"
          inputmode="decimal"
        >


        <input
          id="horarioJantar"
          class="time-input"
          type="time"
        >

      </div>

    </div>



    <div class="field">

      <label>
        📝 Observações
      </label>


      <textarea
        id="observacoes"
        placeholder="Anote algo importante do dia..."
      ></textarea>

    </div>



    <button
      class="save-button"
      onclick="salvarRegistro()"
      id="botaoSalvar"
    >
      Salvar registro
    </button>


    <div
      class="status"
      id="status">
    </div>

  </div>



  <h2 class="history-title">
    Histórico
  </h2>



  <div id="historico">

    <div class="empty">
      Nenhum registro salvo ainda.
    </div>

  </div>


</div>



<script>


/* =====================================================
   FIREBASE
   ===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBFOFv0RsvmtrSOxchD3kUVAMqdmp6VVF0",

  authDomain:
    "glicemia-app-686aa.firebaseapp.com",

  projectId:
    "glicemia-app-686aa",

  storageBucket:
    "glicemia-app-686aa.firebasestorage.app",

  messagingSenderId:
    "312445316096",

  appId:
    "1:312445316096:web:3c274c00e91dfc2686fce5"

};


/*
 * Inicializa Firebase
 */

firebase.initializeApp(
  firebaseConfig
);


/*
 * Firebase Messaging
 */

const messaging =
  firebase.messaging();



/* =====================================================
   URL DA API
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbx-ua_78tMGIbR25K7NlrTs18Gp4cnar8sHaqcnvyNMOy2dnPFBcMlnPUuzX7f7IR_a/exec";



/* =====================================================
   CHAVE VAPID
   ===================================================== */

const VAPID_PUBLIC_KEY =
  "BKgEe2TjSLJ6vItESKJX2eC_8T2VeXlzODt5J0dj3He6hHfeiYfGl_ZYgMph80RmO-YOdj7wpQy5e0x-l8fpRJw";



/* =====================================================
   REGISTROS LOCAIS
   ===================================================== */

let registros =
  JSON.parse(
    localStorage.getItem(
      "glicemia10dias"
    )
  ) || [];



/* =====================================================
   DATA DE HOJE
   ===================================================== */

function dataHoje() {

  const hoje =
    new Date();


  const dia =
    String(
      hoje.getDate()
    ).padStart(2, "0");


  const mes =
    String(
      hoje.getMonth() + 1
    ).padStart(2, "0");


  const ano =
    hoje.getFullYear();


  return (
    `${dia}/${mes}/${ano}`
  );

}



/* =====================================================
   CONVERTER DATA
   ===================================================== */

function converterData(data) {

  if (!data) {
    return null;
  }


  const partes =
    String(data).split("/");


  if (partes.length !== 3) {
    return null;
  }


  return new Date(
    Number(partes[2]),
    Number(partes[1]) - 1,
    Number(partes[0])
  );

}



/* =====================================================
   COMPARAR DATAS
   ===================================================== */

function mesmaData(
  data1,
  data2
) {

  return data1 === data2;

}



/* =====================================================
   CALCULAR DIA
   ===================================================== */

function calcularDia(
  dataInicial,
  dataAtual
) {

  const inicio =
    converterData(
      dataInicial
    );


  const atual =
    converterData(
      dataAtual
    );


  if (!inicio || !atual) {
    return 1;
  }


  inicio.setHours(
    0,
    0,
    0,
    0
  );


  atual.setHours(
    0,
    0,
    0,
    0
  );


  const diferenca =
    Math.floor(
      (
        atual.getTime() -
        inicio.getTime()
      ) /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  return diferenca + 1;

}



/* =====================================================
   ORGANIZAR REGISTROS
   ===================================================== */

function organizarRegistros() {

  registros.sort(
    function(a, b) {

      const dataA =
        converterData(
          a.data
        );


      const dataB =
        converterData(
          b.data
        );


      if (!dataA || !dataB) {
        return 0;
      }


      return dataA - dataB;

    }
  );

}



/* =====================================================
   ATUALIZAR TELA
   ===================================================== */

function atualizarTela() {

  organizarRegistros();


  const hoje =
    dataHoje();


  document.getElementById(
    "dataAtual"
  ).innerText =
    hoje;


  let quantidade =
    registros.length;


  if (quantidade > 10) {
    quantidade = 10;
  }


  document.getElementById(
    "diasPreenchidos"
  ).innerText =
    quantidade;


  document.getElementById(
    "progressFill"
  ).style.width =
    (
      quantidade * 10
    ) + "%";


  let diaAtual =
    1;


  if (registros.length > 0) {

    diaAtual =
      calcularDia(
        registros[0].data,
        hoje
      );

  }


  if (diaAtual < 1) {
    diaAtual = 1;
  }


  if (diaAtual > 10) {
    diaAtual = 10;
  }


  document.getElementById(
    "diaTitulo"
  ).innerText =
    "Dia " + diaAtual;


  const registroHoje =
    registros.find(
      function(registro) {

        return mesmaData(
          registro.data,
          hoje
        );

      }
    );


  if (registroHoje) {

    preencherFormulario(
      registroHoje
    );

  }


  const botao =
    document.getElementById(
      "botaoSalvar"
    );


  if (
    registros.length >= 10 &&
    !registroHoje
  ) {

    botao.disabled =
      true;


    botao.style.opacity =
      "0.6";


    botao.innerText =
      "Acompanhamento concluído";

  } else {

    botao.disabled =
      false;


    botao.style.opacity =
      "1";


    botao.innerText =
      registroHoje
        ? "Atualizar registro"
        : "Salvar registro";

  }


  mostrarHistorico();

}



/* =====================================================
   PREENCHER FORMULÁRIO
   ===================================================== */

function preencherFormulario(
  registro
) {

  document.getElementById(
    "jejum"
  ).value =
    registro.jejum || "";


  document.getElementById(
    "horarioJejum"
  ).value =
    registro.horarioJejum || "";


  document.getElementById(
    "cafe"
  ).value =
    registro.cafe || "";


  document.getElementById(
    "horarioCafe"
  ).value =
    registro.horarioCafe || "";


  document.getElementById(
    "almoco"
  ).value =
    registro.almoco || "";


  document.getElementById(
    "horarioAlmoco"
  ).value =
    registro.horarioAlmoco || "";


  document.getElementById(
    "jantar"
  ).value =
    registro.jantar || "";


  document.getElementById(
    "horarioJantar"
  ).value =
    registro.horarioJantar || "";


  document.getElementById(
    "observacoes"
  ).value =
    registro.observacoes || "";

}



/* =====================================================
   SALVAR REGISTRO
   ===================================================== */

async function salvarRegistro() {

  const status =
    document.getElementById(
      "status"
    );


  const hoje =
    dataHoje();


  let diaAtual =
    1;


  if (registros.length > 0) {

    diaAtual =
      calcularDia(
        registros[0].data,
        hoje
      );

  }


  if (diaAtual > 10) {

    status.innerText =
      "Os 10 dias de acompanhamento já foram concluídos.";


    status.style.color =
      "#a85c72";


    return;

  }


  const dados = {

    id:
      "Dia " + diaAtual,


    data:
      hoje,


    jejum:
      document.getElementById(
        "jejum"
      ).value,


    horarioJejum:
      document.getElementById(
        "horarioJejum"
      ).value,


    cafe:
      document.getElementById(
        "cafe"
      ).value,


    horarioCafe:
      document.getElementById(
        "horarioCafe"
      ).value,


    almoco:
      document.getElementById(
        "almoco"
      ).value,


    horarioAlmoco:
      document.getElementById(
        "horarioAlmoco"
      ).value,


    jantar:
      document.getElementById(
        "jantar"
      ).value,


    horarioJantar:
      document.getElementById(
        "horarioJantar"
      ).value,


    observacoes:
      document.getElementById(
        "observacoes"
      ).value

  };


  if (
    !dados.jejum &&
    !dados.cafe &&
    !dados.almoco &&
    !dados.jantar
  ) {

    status.innerText =
      "Preencha pelo menos uma glicemia.";


    status.style.color =
      "#a85c72";


    return;

  }


  status.innerText =
    "Salvando...";


  status.style.color =
    "#8b7a82";


  const indiceExistente =
    registros.findIndex(
      function(registro) {

        return mesmaData(
          registro.data,
          hoje
        );

      }
    );


  if (
    indiceExistente !== -1
  ) {

    registros[
      indiceExistente
    ] =
      dados;

  } else {

    registros.push(
      dados
    );

  }


  organizarRegistros();


  if (
    registros.length > 10
  ) {

    registros =
      registros.slice(
        0,
        10
      );

  }


  localStorage.setItem(
    "glicemia10dias",
    JSON.stringify(
      registros
    )
  );


  try {

    await fetch(
      API_URL,
      {

        method:
          "POST",


        mode:
          "no-cors",


        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },


        body:
          JSON.stringify(
            dados
          )

      }
    );


    status.innerText =
      indiceExistente !== -1
        ? "✓ Registro atualizado!"
        : "✓ Registro salvo!";


    status.style.color =
      "#6f9278";


  } catch (erro) {

    status.innerText =
      "Salvo no aparelho. Verifique a conexão.";


    status.style.color =
      "#a85c72";

  }


  atualizarTela();

}



/* =====================================================
   HISTÓRICO
   ===================================================== */

function mostrarHistorico() {

  const container =
    document.getElementById(
      "historico"
    );


  if (
    registros.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">Nenhum registro salvo ainda.</div>';


    return;

  }


  container.innerHTML =
    "";


  registros
    .slice()
    .reverse()
    .forEach(
      function(registro) {

        const numeroDia =
          calcularDia(
            registros[0].data,
            registro.data
          );


        const item =
          document.createElement(
            "div"
          );


        item.className =
          "history-item";


        item.innerHTML = `

          <div class="history-header">

            <span class="history-day">
              Dia ${numeroDia}
            </span>

            <span class="history-date">
              ${registro.data}
            </span>

          </div>


          <div class="values">

}

/* =====================================================
   CARREGAR REGISTROS DO GOOGLE SHEETS
   ===================================================== */

async function carregarRegistros() {

  try {

    const resposta =
      await fetch(
        API_URL
      );


    const dados =
      await resposta.json();


    if (
      dados &&
      dados.sucesso &&
      Array.isArray(
        dados.registros
      )
    ) {

      registros =
        dados.registros
          .filter(
            function(registro) {

              return registro.data;

            }
          )
          .map(
            function(registro) {

              return {

                id:
                  registro.id || "",


                data:
                  registro.data || "",


                jejum:
                  registro.jejum || "",


                horarioJejum:
                  registro.horarioJejum || "",


                cafe:
                  registro.cafe || "",


                horarioCafe:
                  registro.horarioCafe || "",


                almoco:
                  registro.almoco || "",


                horarioAlmoco:
                  registro.horarioAlmoco || "",


                jantar:
                  registro.jantar || "",


                horarioJantar:
                  registro.horarioJantar || "",


                observacoes:
                  registro.observacoes || ""

              };

            }
          );


      organizarRegistros();


      registros =
        registros.slice(
          0,
          10
        );


      localStorage.setItem(
        "glicemia10dias",
        JSON.stringify(
          registros
        )
      );


      atualizarTela();

    }


  } catch (erro) {

    console.error(
      "Erro ao carregar registros:",
      erro
    );

    atualizarTela();

  }

}


/* =====================================================
   LEMBRETES
   ===================================================== */

let timerLembrete =
  null;



/*
 * Verifica configuração
 */

function verificarConfiguracaoLembrete() {

  const horario =
    localStorage.getItem(
      "horarioLembreteGlicemia"
    );


  const tela =
    document.getElementById(
      "telaLembrete"
    );


  const botaoAlterar =
    document.getElementById(
      "botaoAlterarLembrete"
    );


  if (!horario) {

    tela.classList.remove(
      "oculta"
    );


    botaoAlterar.classList.remove(
      "visivel"
    );

  } else {

    tela.classList.add(
      "oculta"
    );


    botaoAlterar.classList.add(
      "visivel"
    );


    iniciarLembrete(
      horario
    );

  }

}



/*
 * Ativa lembrete
 */

async function ativarLembrete() {

  const campo =
    document.getElementById(
      "horarioLembrete"
    );


  const horario =
    campo.value;


  const status =
    document.getElementById(
      "statusLembrete"
    );


  if (!horario) {

    status.innerText =
      "Escolha um horário.";


    return;

  }


  /*
   * Solicita permissão
   */

  if (
    "Notification" in window
  ) {

    if (
      Notification.permission ===
      "default"
    ) {

      try {

        await Notification.requestPermission();

      } catch (erro) {

        console.log(
          "Permissão não disponível."
        );

      }

    }

  }


  /*
   * Salva horário
   */

  localStorage.setItem(
    "horarioLembreteGlicemia",
    horario
  );


  /*
   * Ativa Push Firebase
   */

  await ativarPush();


  /*
   * Esconde tela
   */

  document.getElementById(
    "telaLembrete"
  ).classList.add(
    "oculta"
  );


  document.getElementById(
    "botaoAlterarLembrete"
  ).classList.add(
    "visivel"
  );


  /*
   * Agenda enquanto o app
   * estiver aberto
   */

  iniciarLembrete(
    horario
  );


  /*
   * Confirmação
   */

  if (
    "Notification" in window &&
    Notification.permission ===
    "granted"
  ) {

    try {

      new Notification(
        "Lembrete configurado 💗",
        {

          body:
            "Todos os dias às " +
            horario +
            " vamos lembrar você de registrar sua glicemia."

        }
      );

    } catch (erro) {}

  }

}



/*
 * Alterar horário
 */

function mostrarConfiguracaoLembrete() {

  const horario =
    localStorage.getItem(
      "horarioLembreteGlicemia"
    ) ||
    "07:00";


  document.getElementById(
    "horarioLembrete"
  ).value =
    horario;


  document.getElementById(
    "statusLembrete"
  ).innerText =
    "";


  document.getElementById(
    "telaLembrete"
  ).classList.remove(
    "oculta"
  );

}



/*
 * Agenda próximo lembrete
 */

function iniciarLembrete(
  horario
) {

  if (timerLembrete) {

    clearTimeout(
      timerLembrete
    );

  }


  const partes =
    horario.split(":");


  if (
    partes.length !== 2
  ) {

    return;

  }


  const hora =
    Number(
      partes[0]
    );


  const minuto =
    Number(
      partes[1]
    );


  if (
    isNaN(hora) ||
    isNaN(minuto)
  ) {

    return;

  }


  const agora =
    new Date();


  const proximo =
    new Date();


  proximo.setHours(
    hora,
    minuto,
    0,
    0
  );


  if (
    proximo.getTime() <=
    agora.getTime()
  ) {

    proximo.setDate(
      proximo.getDate() + 1
    );

  }


  const tempo =
    proximo.getTime() -
    agora.getTime();


  timerLembrete =
    setTimeout(
      function() {

        mostrarNotificacao();


        iniciarLembrete(
          horario
        );

      },
      tempo
    );

}



/*
 * Notificação local
 */

function mostrarNotificacao() {

  const titulo =
    "Hora da glicemia 💗";


  const mensagem =
    "Não se esqueça de registrar sua glicemia de hoje.";


  if (
    "Notification" in window &&
    Notification.permission ===
    "granted"
  ) {

    try {

      new Notification(
        titulo,
        {

          body:
            mensagem

        }
      );


      return;

    } catch (erro) {}

  }


  alert(
    titulo +
    "\n\n" +
    mensagem
  );

}



/* =====================================================
   FIREBASE PUSH
   ===================================================== */

async function ativarPush() {

  try {

    /*
     * Verifica Service Worker
     */

    if (
      !("serviceWorker" in navigator)
    ) {

      console.log(
        "Service Worker não disponível."
      );

      return;

    }


    /*
     * Verifica Firebase
     */

    if (
      typeof firebase ===
      "undefined"
    ) {

      console.log(
        "Firebase não carregado."
      );

      return;

    }


    /*
     * Verifica Notification
     */

    if (
      !("Notification" in window)
    ) {

      console.log(
        "Notificações não disponíveis."
      );

      return;

    }


    /*
     * Permissão
     */

    let permissao =
      Notification.permission;


    if (
      permissao ===
      "default"
    ) {

      permissao =
        await Notification.requestPermission();

    }


    if (
      permissao !==
      "granted"
    ) {

      console.log(
        "Permissão para notificações não concedida."
      );

      return;

    }


    /*
     * Pega o Service Worker
     */

    const registro =
      await navigator.serviceWorker.ready;


    /*
     * Obtém token do Firebase
     */

    const token =
      await messaging.getToken({

        vapidKey:
          VAPID_PUBLIC_KEY,

        serviceWorkerRegistration:
          registro

      });


    if (!token) {

      console.log(
        "Firebase não retornou token."
      );

      return;

    }


    /*
     * Salva token localmente
     */

    localStorage.setItem(
      "firebaseMessagingToken",
      token
    );


    console.log(
      "FIREBASE PUSH ATIVADO!"
    );


    console.log(
      "Token FCM:",
      token
    );


    /*
     * Também guarda a inscrição
     * existente do navegador
     */

    try {

      const inscricao =
        await registro.pushManager
          .getSubscription();


      if (inscricao) {

        localStorage.setItem(
          "pushSubscription",
          JSON.stringify(
            inscricao
          )
        );

      }

    } catch (erro) {

      console.log(
        "Não foi possível obter PushSubscription."
      );

    }


  } catch (erro) {

    console.error(
      "Erro ao ativar Firebase Push:",
      erro
    );

  }

}



/* =====================================================

atualizarTela();


carregarRegistros();


verificarConfiguracaoLembrete();

 */

window.addEventListener(
  "load",
  function() {

    const horario =
      localStorage.getItem(
        "horarioLembreteGlicemia"
      );


    if (horario) {

      setTimeout(
        function() {

        },

      );

    }

  }
